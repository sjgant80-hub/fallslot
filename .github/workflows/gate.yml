name: gate
on: [push, workflow_dispatch]
jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: proof-of-play — the double-booking guard
        run: node booking.test.mjs

      # ⚑ Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break the tests
        run: |
          git clone --depth 1 --branch v0.2 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate booking.mjs \
            --cap 400 \
            --baseline witness.booking.baseline.json \
            --test "node booking.test.mjs"

      # ⚑ The page must BE the kernel that was just gated, not a copy of it that has drifted.
      - name: the shipped page still matches the gated kernel
        run: |
          cp index.html /tmp/shipped.html
          node build-page.mjs
          diff -q /tmp/shipped.html index.html || {
            echo "::error::index.html has drifted from booking.mjs — run build-page.mjs and commit."
            exit 1
          }
